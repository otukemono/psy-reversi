<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">PSY-REVERSI｜サイリバーシ α</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#150d08;
    --bg-grad:#1f140c;
    --panel:#251708;
    --panel-2:#2f1d0d;
    --panel-line:#4a3016;
    --gold:#d4af37;
    --gold-soft:#e9d18e;
    --gold-dim:#8c7136;
    --board:#0d4a33;
    --board-dark:#093524;
    --cell-line:rgba(0,0,0,.28);
    --text:#f3ead8;
    --text-dim:#c2b291;
    --black-a:#4a4a4a;
    --black-b:#050505;
    --white-a:#ffffff;
    --white-b:#c9c9c9;
    --c-reverse:#3f7fae;
    --c-block:#3f8f5e;
    --c-slide:#9a5fc0;
    --c-bind:#c0793f;
    --danger:#b1453f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, var(--bg-grad), var(--bg) 70%);
    font-family:'Noto Sans JP',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:22px 14px 40px;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{width:100%;max-width:920px;}
  .cell, .card, .card-back, .discard-chip, .btn{
    touch-action:manipulation;
  }
  .screen{display:none;}
  .screen.active{display:block;}

  h1{
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    text-align:center;
    letter-spacing:.12em;
    font-size:clamp(22px,4vw,32px);
    margin:4px 0 2px;
    color:var(--gold-soft);
    text-shadow:0 0 18px rgba(212,175,55,.25);
  }
  .version-tag{
    font-family:'Noto Sans JP',sans-serif;
    font-size:11px;
    font-weight:400;
    letter-spacing:0;
    color:var(--text-dim);
    text-shadow:none;
    vertical-align:middle;
  }
  .title-logo{
    display:block;
    width:100%;
    max-width:460px;
    margin:6px auto 0;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));
  }
  .visually-hidden{
    position:absolute;width:1px;height:1px;
    padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  .version-tag-standalone{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    margin:2px 0 12px;
  }
  .subtitle{
    text-align:center;
    color:var(--text-dim);
    font-size:12.5px;
    letter-spacing:.08em;
    margin-bottom:18px;
  }

  /* --- Title / Lobby screens --- */
  .title-wrap{
    max-width:480px;margin:40px auto 0;
    display:flex;flex-direction:column;align-items:center;
  }
  .title-lang-row{
    display:flex;justify-content:center;margin-bottom:8px;
  }
  .lang-toggle{
    display:flex;border:1px solid var(--gold-dim);border-radius:20px;overflow:hidden;
  }
  .lang-toggle button{
    border:none;background:transparent;color:var(--text-dim);
    padding:6px 16px;font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;
    transition:.15s;
  }
  .lang-toggle button.active{background:var(--gold);color:#241505;font-weight:700;}
  .mode-list{
    width:100%;display:flex;flex-direction:column;gap:12px;margin-top:22px;
  }
  .mode-card{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:16px 18px;
    text-align:left;
    cursor:pointer;
    color:var(--text);
    font-family:'Noto Sans JP',sans-serif;
    transition:.15s;
  }
  .mode-card:hover:not(:disabled){border-color:var(--gold);box-shadow:0 0 18px rgba(212,175,55,.2);transform:translateY(-2px);}
  .mode-card:disabled{opacity:.4;cursor:not-allowed;}
  .mode-card .mode-title{
    font-family:'Shippori Mincho',serif;font-weight:700;font-size:16px;color:var(--gold-soft);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .mode-card .mode-desc{font-size:12.5px;color:var(--text-dim);margin-top:5px;line-height:1.5;}
  .mode-card .mode-badge{
    font-size:10.5px;border:1px solid var(--gold-dim);border-radius:10px;padding:2px 8px;color:var(--text-dim);white-space:nowrap;
  }

  .lobby-box{
    width:100%;background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--panel-line);border-radius:14px;padding:20px;margin-top:18px;
  }
  .lobby-section{margin-bottom:18px;}
  .lobby-section:last-child{margin-bottom:0;}
  .lobby-section h3{
    font-family:'Shippori Mincho',serif;color:var(--gold-soft);font-size:14px;margin:0 0 10px;
  }
  .lobby-input{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--panel-line);
    background:rgba(0,0,0,.25);color:var(--text);font-size:16px;letter-spacing:.15em;
    text-align:center;font-family:'Shippori Mincho',serif;text-transform:uppercase;
    margin-bottom:10px;
  }
  .lobby-input::placeholder{color:var(--text-dim);letter-spacing:.05em;font-family:'Noto Sans JP',sans-serif;}
  .lobby-msg{font-size:12.5px;color:var(--text-dim);min-height:18px;margin-top:8px;}
  .lobby-msg.error{color:#f3b6b0;}
  .lobby-msg.ok{color:var(--gold-soft);}
  .hr-divider{
    display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:11px;margin:16px 0;
  }
  .hr-divider::before,.hr-divider::after{content:"";flex:1;height:1px;background:var(--panel-line);}

  .room-info-bar{
    background:linear-gradient(160deg,#3a2864,#241645);
    border:1px solid var(--gold);
    border-radius:12px;
    padding:10px 16px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;
    margin-bottom:10px;
    font-size:12.5px;
  }
  .room-info-bar .room-code{font-family:'Shippori Mincho',serif;color:var(--gold-soft);font-size:16px;letter-spacing:.15em;font-weight:700;}
  .waiting-overlay{
    position:fixed;inset:0;background:rgba(8,4,2,.82);
    display:none;align-items:center;justify-content:center;z-index:60;padding:20px;
  }
  .waiting-overlay.show{display:flex;}
  .waiting-card{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--gold);border-radius:16px;padding:32px;text-align:center;max-width:320px;
  }
  .waiting-card .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid var(--panel-line);border-top-color:var(--gold);
    margin:0 auto 16px;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .waiting-card .room-code-big{
    font-family:'Shippori Mincho',serif;font-size:26px;color:var(--gold-soft);letter-spacing:.2em;margin:10px 0;font-weight:800;
  }

  .top-bar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:6px;gap:8px;flex-wrap:wrap;
  }
  .top-bar-left{display:flex;align-items:center;gap:10px;}
.top-info-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .turn-indicator{
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--panel-line);
    border-radius:20px;
    padding:8px 20px;
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:14px;
    color:var(--gold-soft);
    transition:border-color .25s, box-shadow .25s;
  }
  .turn-indicator.pulsing{
    border-color:var(--gold);
    box-shadow:0 0 16px rgba(212,175,55,.3);
  }
  .board-row{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:14px;
    margin:6px 0 14px;
    flex-wrap:wrap;
  }
  .board-row .hand-panel{
    flex:0 1 220px;
    width:220px;
    max-width:220px;
  }
  .board-row .board-area{
    margin:0;
    flex:0 0 auto;
  }
  @media (max-width:820px){
    .board-row{ flex-direction:column; align-items:center; }
    .board-row .hand-panel{ width:100%; max-width:480px; flex-basis:auto; }
  }

  .hand-panel{
    flex:1 1 300px;
    max-width:360px;
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:10px 12px 12px;
    position:relative;
    transition:box-shadow .25s, border-color .25s;
  }
  .hand-panel.active-turn{
    border-color:var(--gold);
    box-shadow:0 0 0 1px var(--gold-dim), 0 0 22px rgba(212,175,55,.25);
  }
  .hand-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .hand-title{
    display:flex;align-items:center;gap:7px;
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:14px;
  }
  .stone-dot{
    width:15px;height:15px;border-radius:50%;
    display:inline-block;
    box-shadow:inset -2px -2px 3px rgba(0,0,0,.4), inset 2px 2px 3px rgba(255,255,255,.15);
  }
  .stone-dot.b{background:radial-gradient(circle at 32% 30%, var(--black-a), var(--black-b));}
  .stone-dot.w{background:radial-gradient(circle at 32% 30%, var(--white-a), var(--white-b));}
  .hand-score{font-size:12px;color:var(--text-dim);}
  .hand-cards{
    display:flex;gap:7px;flex-wrap:wrap;
    min-height:78px;
  }
  .card{
    width:64px;height:78px;
    border-radius:9px;
    padding:6px 5px;
    display:flex;flex-direction:column;justify-content:space-between;align-items:center;
    text-align:center;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.18);
    color:#fff;
    font-size:9.5px;
    line-height:1.15;
    user-select:none;
    transition:transform .15s, box-shadow .15s, filter .15s;
    position:relative;
  }
  .card .cost{position:absolute;top:3px;left:4px;font-size:8.5px;background:rgba(0,0,0,.4);padding:1px 4px;border-radius:6px;}
  .card .icon{font-size:19px;}
  .card .name{font-weight:700;font-size:9.5px;font-family:'Shippori Mincho',serif;}
  .card.type-reverse{background:linear-gradient(160deg,#5b93c9,var(--c-reverse));}
  .card.type-block{background:linear-gradient(160deg,#5fb283,var(--c-block));}
  .card.type-slide{background:linear-gradient(160deg,#b784de,var(--c-slide));}
  .card.type-bind{background:linear-gradient(160deg,#dd9a63,var(--c-bind));}
  .card.type-swap{background:linear-gradient(160deg,#7ec9c4,#2f8f88);}
  .card.type-twoDrop{background:linear-gradient(160deg,#e0a5c9,#b03f80);}
  .card.type-triReverse{background:linear-gradient(160deg,#7f9de0,#3f57ae);}
  .card.type-mindRead{background:linear-gradient(160deg,#c9b0e8,#6f3fae);}
  .card.type-doubleTap{background:linear-gradient(160deg,#f0c98a,#c07a2f);}
  .card.type-triBlock{background:linear-gradient(160deg,#8fd0a0,#2f8f5e);}
  .card.type-freeDrop{background:linear-gradient(160deg,#f0908a,#ae3f3f);}
  .card.type-recycle{background:linear-gradient(160deg,#a9d98a,#4f8f2f);}
  .card.type-lineDomination{background:linear-gradient(160deg,#f0d18a,#b0842f);}
  .card.type-dualLineDomination{background:linear-gradient(160deg,#f0a8d1,#ae3f8a);}
  .card.type-doubleBind{background:linear-gradient(160deg,#f0c07a,#c0632f);}
  .card:hover{transform:translateY(-4px);box-shadow:0 8px 14px rgba(0,0,0,.4);}
  .card.disabled{filter:grayscale(.7) brightness(.55);cursor:not-allowed;transform:none;box-shadow:none;}
  .card.selected{outline:3px solid var(--gold);outline-offset:1px;transform:translateY(-4px);}
  .card-empty-slot{
    width:64px;height:78px;border-radius:9px;
    border:1px dashed rgba(255,255,255,.15);
  }
  .card-back{
    width:64px;height:78px;border-radius:9px;
    background:repeating-linear-gradient(135deg,#3a2812,#3a2812 4px,#33210f 4px,#33210f 8px);
    border:1px solid var(--gold-dim);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--gold-dim);
  }
  .card-back.mindread-target{
    cursor:pointer;
    border:2px solid var(--gold-soft);
    box-shadow:0 0 10px rgba(233,209,142,.6);
    animation:pulse 1.1s infinite;
  }
  .card-back.mindread-target:hover{transform:translateY(-4px);}
  .card.swap-target{
    cursor:pointer;
    outline:3px solid var(--gold-soft);
    outline-offset:1px;
    box-shadow:0 0 12px rgba(233,209,142,.7);
    animation:pulse 1.1s infinite;
  }
  .discard-chip.recycle-target{
    cursor:pointer;
    outline:2px solid var(--gold-soft);
    outline-offset:1px;
    box-shadow:0 0 10px rgba(233,209,142,.6);
    animation:pulse 1.1s infinite;
    opacity:1;
  }
  .discard-chip.recycle-target:hover{transform:translateY(-4px);}
  .reveal-btn{
    display:block;
    width:100%;
    margin-bottom:8px;
    font-size:11.5px;
    padding:6px 10px;
  }
  .reveal-btn.revealed{background:rgba(212,175,55,.18);}
  #modeRowBtn.mode-active, #modeColBtn.mode-active{background:var(--gold);color:#241505;border-color:var(--gold);font-weight:700;}
  .hand-hidden-note{
    font-size:11px;color:var(--text-dim);text-align:center;
    padding:14px 4px;width:100%;
  }

  .deck-panel{
    flex:0 0 130px;
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--panel-line);
    border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;
    padding:10px;
  }
  .deck-stack{
    width:56px;height:76px;border-radius:8px;
    background:
      repeating-linear-gradient(135deg,#3a2812,#3a2812 4px,#33210f 4px,#33210f 8px);
    border:1px solid var(--gold-dim);
    box-shadow:2px 2px 0 -1px var(--panel-2), 4px 4px 0 -1px var(--panel-line);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
  }
  .deck-label{font-size:11px;color:var(--text-dim);text-align:center;}
  .deck-count{font-family:'Shippori Mincho',serif;color:var(--gold-soft);font-size:15px;font-weight:700;}

  .board-area{
    display:flex;justify-content:center;
    margin:6px 0 14px;
  }
  .board{
    background:linear-gradient(160deg,var(--board),var(--board-dark));
    border-radius:10px;
    padding:10px;
    display:grid;
    grid-template-columns:repeat(8,minmax(0,1fr));
    grid-template-rows:repeat(8,minmax(0,1fr));
    gap:3px;
    width:min(92vw,436px);
    aspect-ratio:1/1;
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(212,175,55,.25);
  }
  .cell{
    background:var(--board);
    border:1px solid var(--cell-line);
    border-radius:3px;
    position:relative;
    display:flex;align-items:center;justify-content:center;
    cursor:default;
  }
  .cell.clickable{cursor:pointer;}
  .cell .stone{
    width:82%;height:82%;border-radius:50%;
    box-shadow:0 3px 5px rgba(0,0,0,.5), inset -3px -3px 5px rgba(0,0,0,.35), inset 3px 3px 5px rgba(255,255,255,.15);
    transition:transform .25s ease;
    animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.3);}to{transform:scale(1);}}
  .cell .stone.b{background:radial-gradient(circle at 32% 28%, var(--black-a), var(--black-b) 75%);}
  .cell .stone.w{background:radial-gradient(circle at 32% 28%, var(--white-a), var(--white-b) 75%);}
  .cell .dot{
    width:22%;height:22%;border-radius:50%;
    background:rgba(212,175,55,.55);
    box-shadow:0 0 8px rgba(212,175,55,.6);
  }
  .cell.card-target::after{
    content:"";
    position:absolute;inset:6%;
    border-radius:50%;
    border:2.5px solid var(--gold-soft);
    box-shadow:0 0 10px rgba(233,209,142,.7);
    animation:pulse 1.1s infinite;
  }
  @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
  .cell.selected-source::after{
    content:"";
    position:absolute;inset:4%;
    border-radius:50%;
    border:2.5px solid #fff;
  }
  .cell.trio-preview{
    background:rgba(212,175,55,.28) !important;
  }
  .cell.trio-preview::before{
    content:"";
    position:absolute;inset:8%;
    border-radius:6px;
    border:2px dashed var(--gold-soft);
    box-shadow:0 0 10px rgba(233,209,142,.55);
    animation:pulse 1.1s infinite;
  }
  .cell.protected .badge{
    position:absolute;top:1px;right:1px;font-size:9px;
    filter:drop-shadow(0 0 2px #000);
  }
  .cell.bound{
    background:repeating-linear-gradient(45deg,var(--board),var(--board) 4px,#2a1608 4px,#2a1608 8px);
  }
  .cell.bound .badge{
    font-size:15px;opacity:.85;filter:drop-shadow(0 0 2px #000);
  }

  .mindread-banner{
    background:linear-gradient(160deg,#3a2864,#241645);
    border:2px solid var(--gold);
    border-radius:12px;
    padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;
    margin-bottom:10px;
    box-shadow:0 0 24px rgba(212,175,55,.35);
    animation:banner-in .25s ease;
  }
  .last-turn-banner{
    background:rgba(0,0,0,.2);
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:7px 14px;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:8px;
    animation:banner-in .2s ease;
  }
  .last-turn-banner b{color:var(--gold-soft);}
  .deck-reshuffle-banner{
    background:linear-gradient(160deg,#3a2812,#2f1d0d);
    border:1px solid var(--gold-dim);
    border-radius:10px;
    padding:8px 14px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;
    font-size:12.5px;
    color:var(--gold-soft);
    margin-bottom:8px;
    animation:banner-in .2s ease;
  }
  @keyframes banner-in{
    from{opacity:0;transform:translateY(-6px);}
    to{opacity:1;transform:translateY(0);}
  }
  .mindread-banner-text{
    font-size:13.5px;color:var(--gold-soft);flex:1 1 260px;
    font-family:'Shippori Mincho',serif;
    font-weight:700;
  }
  .status-bar{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--panel-line);
    border-radius:12px;
    padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;
    margin-bottom:10px;
  }
  .status-msg{font-size:13px;color:var(--text);flex:1 1 260px;}
  .status-msg b{color:var(--gold-soft);}
  .btn{
    font-family:'Noto Sans JP',sans-serif;
    border:1px solid var(--gold-dim);
    background:transparent;
    color:var(--gold-soft);
    padding:8px 16px;
    border-radius:20px;
    font-size:12.5px;
    cursor:pointer;
    transition:.15s;
    white-space:nowrap;
  }
  .btn:hover:not(:disabled){background:rgba(212,175,55,.15);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.primary{background:var(--gold);color:#241505;border-color:var(--gold);font-weight:700;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.danger{border-color:var(--danger);color:#f3b6b0;}

  .rules{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--panel-line);
    border-radius:12px;
    padding:4px 16px 12px;
    font-size:12.5px;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .rules summary{cursor:pointer;padding:10px 0;font-family:'Shippori Mincho',serif;color:var(--gold-soft);font-size:13.5px;}
  .rules ul{margin:4px 0 8px;padding-left:18px;}
  .rules li{margin:4px 0;}
  .rules .tag{display:inline-block;min-width:88px;font-weight:700;}
  .tag.type-reverse{color:#8fbfeb;}
  .tag.type-block{color:#8fdcab;}
  .tag.type-slide{color:#d3a7f2;}
  .tag.type-bind{color:#f0b482;}
  .tag.cat-info{color:#8fd0e0;}
  .tag.cat-support{color:#f0c98a;}
  .tag.cat-defense{color:#8fdcab;}
  .tag.cat-board{color:#d3a7f2;}
  .tag.cat-placement{color:#f0908a;}
  .tag.cat-domination{color:#e8b25a;}

  .overlay{
    position:fixed;inset:0;background:rgba(8,4,2,.78);
    display:none;align-items:center;justify-content:center;z-index:50;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .result-card{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--gold);
    border-radius:16px;
    padding:34px 40px;
    text-align:center;
    max-width:340px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .result-card h2{
    font-family:'Shippori Mincho',serif;
    color:var(--gold-soft);
    font-size:22px;margin:0 0 10px;
  }
  .result-score{font-size:15px;margin:14px 0 20px;color:var(--text-dim);}
  .result-score b{color:var(--text);font-size:18px;}

  .discard-panel{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:10px 14px 12px;
    margin-bottom:14px;
  }
  .discard-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;
  }
  .discard-title{
    font-family:'Shippori Mincho',serif;
    font-weight:700;font-size:13px;color:var(--text-dim);
  }
  .discard-count{font-size:11.5px;color:var(--gold-soft);}
  .discard-cards{
    display:flex;gap:6px;flex-wrap:wrap;
    min-height:52px;
    max-height:150px;
    overflow-y:auto;
  }
  .discard-empty-note{
    font-size:11.5px;color:var(--text-dim);
    padding:14px 4px;
  }
  .discard-chip{
    width:52px;height:64px;border-radius:8px;
    padding:5px 4px;
    display:flex;flex-direction:column;justify-content:space-between;align-items:center;
    text-align:center;
    color:#fff;
    font-size:8.5px;line-height:1.1;
    opacity:.85;
    border:1px solid rgba(255,255,255,.15);
    flex-shrink:0;
  }
  .discard-chip .icon{font-size:15px;}
  .discard-chip .name{font-weight:700;font-size:8px;font-family:'Shippori Mincho',serif;}
  .discard-chip.owner-1{box-shadow:0 0 0 2px rgba(255,255,255,.5) inset;}
  .discard-chip.owner-2{box-shadow:0 0 0 2px rgba(0,0,0,.55) inset;}
  .discard-chip.type-reverse{background:linear-gradient(160deg,#5b93c9,var(--c-reverse));}
  .discard-chip.type-block{background:linear-gradient(160deg,#5fb283,var(--c-block));}
  .discard-chip.type-slide{background:linear-gradient(160deg,#b784de,var(--c-slide));}
  .discard-chip.type-bind{background:linear-gradient(160deg,#dd9a63,var(--c-bind));}
  .discard-chip.type-swap{background:linear-gradient(160deg,#7ec9c4,#2f8f88);}
  .discard-chip.type-twoDrop{background:linear-gradient(160deg,#e0a5c9,#b03f80);}
  .discard-chip.type-triReverse{background:linear-gradient(160deg,#7f9de0,#3f57ae);}
  .discard-chip.type-mindRead{background:linear-gradient(160deg,#c9b0e8,#6f3fae);}
  .discard-chip.type-doubleTap{background:linear-gradient(160deg,#f0c98a,#c07a2f);}
  .discard-chip.type-triBlock{background:linear-gradient(160deg,#8fd0a0,#2f8f5e);}
  .discard-chip.type-freeDrop{background:linear-gradient(160deg,#f0908a,#ae3f3f);}
  .discard-chip.type-recycle{background:linear-gradient(160deg,#a9d98a,#4f8f2f);}
  .discard-chip.type-lineDomination{background:linear-gradient(160deg,#f0d18a,#b0842f);}
  .discard-chip.type-dualLineDomination{background:linear-gradient(160deg,#f0a8d1,#ae3f8a);}
  .discard-chip.type-doubleBind{background:linear-gradient(160deg,#f0c07a,#c0632f);}

  @media (max-width:520px){
    .hand-panel{max-width:100%;}
    .deck-panel{flex-basis:100%;flex-direction:row;justify-content:center;}
    .btn{padding:10px 14px;font-size:13px;}
    .status-bar{flex-direction:column;align-items:stretch;}
    .status-bar > div{width:100%;}
    .status-controls{justify-content:flex-start;}
    .card, .card-back, .card-empty-slot{width:58px;height:70px;}
    .discard-chip{width:46px;height:58px;}
    h1{line-height:1.3;}
  }
</style>
</head>

  // evaluates .read at the exact requested path (cascading only from
  // ancestors DOWN to it, never "peeking" into more-permissive descendants).
  // Since hands/black and hands/white each carry their own restrictive
  // .read rule and there is intentionally no blanket .read at rooms/$code,
  // a whole-room read is denied outright even for the parts that WOULD be
  // individually readable. Every method below reads/writes exactly the
  // sub-path it needs instead.
  async getRoom(code){
    const stateSnap=await get(ref(db,'rooms/'+code+'/state'));
    if(!stateSnap.exists()) return null;
    const playersSnap=await get(ref(db,'rooms/'+code+'/players'));
    return { state: stateSnap.val(), players: playersSnap.exists()?playersSnap.val():null };
  },
  async setRoom(code,data){ await set(ref(db,'rooms/'+code),data); return true; },
  async claimGuest(code){
    const user=await authReady; if(!user) throw new Error('auth');

    // The white slot is the single source of truth for admission.
    // Re-entering with the same anonymous Firebase UID is allowed.
    const whiteRef=ref(db,'rooms/'+code+'/players/white');
    const claim=await runTransaction(whiteRef, current=>{
      if(current && current!==user.uid) return;
      return user.uid;
    }, {applyLocally:false});

    if(!claim.committed) return {ok:false, reason:'full'};

    // Mark White as joined in state. Plain read-then-write (not a
    // transaction) - nobody else is writing state at this exact moment
    // (the host is idle waiting), so the tiny race window is an acceptable
    // trade for avoiding transaction-specific edge cases. If this fails we
    // roll back the slot and surface the REAL underlying error message.
    let joinedState;
    try{
      const stateSnap=await get(ref(db,'rooms/'+code+'/state'));
      if(!stateSnap.exists()){
        await runTransaction(whiteRef, current=>current===user.uid?null:current, {applyLocally:false});
        return {ok:false, reason:'not-found'};
      }
      joinedState=stateSnap.val();
      joinedState.joined=joinedState.joined||{1:true,2:false};
      joinedState.joined[1]=true;
      joinedState.joined[2]=true;
      joinedState.seq=(joinedState.seq||0)+1;
      await set(ref(db,'rooms/'+code+'/state'), joinedState);
    }catch(e){
      console.error('claimGuest: state update failed:', e && e.code, e && e.message);
      await runTransaction(whiteRef, current=>current===user.uid?null:current, {applyLocally:false});
      throw new Error('state-join-update-failed: '+(e && (e.code||e.message)||'unknown'));
    }

    const whiteHandSnap=await get(ref(db,'rooms/'+code+'/hands/white'));
    return {ok:true, room:{ state: joinedState, hands:{ white: whiteHandSnap.exists()?whiteHandSnap.val():[] } }};
  },
  async releaseGuest(code){
    const user=await authReady; if(!user || !code) return false;
    const whiteRef=ref(db,'rooms/'+code+'/players/white');
    const released=await runTransaction(whiteRef, current=>{
      if(current!==user.uid) return;
      return null;
    }, {applyLocally:false});
    if(!released.committed) return false;

    const stateRef=ref(db,'rooms/'+code+'/state');
    await runTransaction(stateRef, state=>{
      if(!state) return state;
      state.joined=state.joined||{1:true,2:false};
      state.joined[2]=false;
      state.seq=(state.seq||0)+1;
      return state;
    }, {applyLocally:false});
    return true;
  },
  async createRoom(code,state,blackHand,whiteHand){
    const user=await authReady; if(!user) throw new Error('auth');
    // Written as separate scoped writes (not one set() on the room root) so
    // each one is checked against its OWN .write rule. players must land
    // first: hands/black's rule and hands/white's bootstrap-write rule both
    // check players/black, and hands/white's rule also checks that
    // players/white does not exist yet.
    await set(ref(db,'rooms/'+code+'/players'), {black:user.uid});
    await set(ref(db,'rooms/'+code+'/state'), state);
    await set(ref(db,'rooms/'+code+'/createdAt'), Date.now());
    await set(ref(db,'rooms/'+code+'/hands/black'), blackHand);
    await set(ref(db,'rooms/'+code+'/hands/white'), whiteHand);
    return true;
  },
  async pushHand(code,colorKey,hand){
    const user=await authReady; if(!user) throw new Error('auth');
    await set(ref(db,'rooms/'+code+'/hands/'+colorKey),hand);
    return true;
  },
  async pushState(code,state,role){
    const user=await authReady; if(!user) throw new Error('auth');
    // Identity check reads players (broadly readable) separately - state
    // itself is updated via plain read-then-write rather than a
    // runTransaction(), since transactions on this path have shown
    // unexplained commit failures in production; genuine concurrent writers
    // to state are rare by design (only the acting player pushes turns,
    // and the mind-read handshake is a strict back-and-forth), so the small
    // race window this trades away transaction-safety for is acceptable.
    const playersSnap=await get(ref(db,'rooms/'+code+'/players'));
    if(!playersSnap.exists()) return false;
    const players=playersSnap.val();
    const expected=role===1?players.black:players.white;
    if(expected!==user.uid) return false;
    try{
      const stateSnap=await get(ref(db,'rooms/'+code+'/state'));
      const currentSeq=(stateSnap.exists() && stateSnap.val().seq)||0;
      if((state.seq||0)<=currentSeq) state.seq=currentSeq+1;
      await set(ref(db,'rooms/'+code+'/state'), state);
      return true;
    }catch(e){
      console.error('pushState failed:', e && e.code, e && e.message);
      return false;
    }
  },
  listen(code,cb){
    if(unsubscribeRoom) unsubscribeRoom();
    // Subscribe to state only - hands are fetched once (getRoom/claimGuest)
    // and kept locally afterward, never live-listened.
    const r=ref(db,'rooms/'+code+'/state');
    unsubscribeRoom=onValue(r, s=>cb(s.exists()?{state:s.val()}:null));
  },
  unlisten(){ if(unsubscribeRoom){ unsubscribeRoom(); unsubscribeRoom=null; } },
  async removeRoom(code){
    // Best-effort, per-path cleanup. hands/white may already be locked to
    // the guest's uid by the time the host leaves, so that specific delete
    // can fail without blocking the rest - this mirrors how leaveRoom()
    // already treats the whole cleanup as non-fatal.
    const paths=['state','players','createdAt','hands/black','hands/white'];
    for(const p of paths){
      try{ await remove(ref(db,'rooms/'+code+'/'+p)); }catch(e){}
    }
  }
};

function computeFlipsAt(r,c,player){
  const opp = 3-player;
  let flips = [];
  for(const [dr,dc] of DIRS){
    let rr=r+dr, cc=c+dc;
    const line=[];
    while(rr>=0&&rr<SIZE&&cc>=0&&cc<SIZE&&board[rr][cc]===opp){
      line.push([rr,cc]); rr+=dr; cc+=dc;
    }
    if(line.length>0 && rr>=0&&rr<SIZE&&cc>=0&&cc<SIZE&&board[rr][cc]===player){
      flips.push(...line);
    }
  }
  return flips;
}

        }
        if(line.length>0 && rr>=0&&rr<SIZE&&cc>=0&&cc<SIZE&&board[rr][cc]===player){
          flips.push(...line);
        }
      }
      if(flips.length>0) moves.push({r,c,flips});
    }
  }
  return moves;
}

function placeStone(r,c,mv){
  board[r][c] = current;
  mv.flips.forEach(([fr,fc])=>{
    if(!protectedCells[cellKey(fr,fc)]) board[fr][fc] = current;
  });
  logAction({kind:'place', r, c});
  passStreak = 0;
  placementsLeft -= 1;
  if(placementsLeft > 0 && getAvailableMoves().length > 0){
    checkGameEnd();
    render();
    if(onlineMode) pushOnlineState();
  } else {
    endTurn();
  }
}

function endTurn(){
  const finishedPlayer = current;
  const whiteFirstTurnBonus = (current === 2 && turnNumber === 2);
  drawCard(current);
  if(whiteFirstTurnBonus) drawCard(current);
  current = 3-current;
  turnNumber += 1;
  if(current === 1) grantRoundBits();
  if(lastBoardManipEffect && turnNumber > lastBoardManipEffect.castOnTurn + 1){
    lastBoardManipEffect = null;
  }
  Object.keys(protectedCells).forEach(k=>{
    if(protectedCells[k].caster === current) delete protectedCells[k];
  });
  Object.keys(boundCells).forEach(k=>{
    if(boundCells[k].caster === current) delete boundCells[k];
  });
  pendingCard = null;
  cardUsesLeft = 1;
  placementsLeft = 1;
  handRevealed = onlineMode ? {1: myPlayerNumber===1, 2: myPlayerNumber===2} : {1:false, 2:false};
  doubleTapCostCap = null;
  freeDropActive = false;
  twoDropFreeFirst = false;
  lastMindRead = null;
  redrawUsedThisTurn = false;
  redrawPending = false;
  lastTurnLog = (turnActionLog && turnActionLog.length>0) ? {player: finishedPlayer, actions: turnActionLog} : null;
  turnActionLog = [];
  checkGameEnd();
  render();
  if(onlineMode) pushOnlineState();
}

function checkGameEnd(){
  const full = board.flat().every(v=>v!==0);
  if(full){
    gameOver = true;
  }
}

function consumeCard(){
  const type = pendingCard.card.type;
  logAction({kind:'card', cardType:type});
  if(pendingCard.isRecycled){
    const cost = pendingCard.dynamicCost;
    bits[current] = Math.max(0, bits[current] - cost);
    const hand = hands[current];
    const idx = hand.findIndex(c=>c.id===pendingCard.recycleSourceCard.id);
    if(idx>-1){
      hand[idx].owner = current;
      discard.push(hand[idx]);
      hand.splice(idx,1);
    }
    cardUsesLeft -= 1;
    if(type === 'twoDrop'){ placementsLeft = 2; twoDropFreeFirst = true; }
    if(type === 'doubleTap'){ cardUsesLeft += 2; doubleTapCostCap = 6; }
    if(type === 'freeDrop'){ freeDropActive = true; }
    pendingCard = null;
    checkGameEnd();
    render();
    if(onlineMode) pushOnlineState();
    return;
  }
  const hand = hands[current];
  const idx = hand.findIndex(c=>c.id===pendingCard.card.id);
  bits[current] = Math.max(0, bits[current] - CARD_TYPES[type].cost);
  if(idx>-1){
    hand[idx].owner = current;
    discard.push(hand[idx]);
    hand.splice(idx,1);
  }
  cardUsesLeft -= 1;
  if(type === 'twoDrop'){ placementsLeft = 2; twoDropFreeFirst = true; }
  if(type === 'doubleTap'){ cardUsesLeft += 2; doubleTapCostCap = 6; }
  if(type === 'freeDrop'){ freeDropActive = true; }
  pendingCard = null;
  checkGameEnd();
  render();
  if(onlineMode) pushOnlineState();
}

function recycleCost(targetType){
  return CARD_TYPES[targetType].cost + 1;
}

function isRecycleEligible(targetCard){
  if(!targetCard || targetCard.type === 'recycle') return false;
  const cost = recycleCost(targetCard.type);
  if(bits[current] < cost) return false;
  if(doubleTapCostCap !== null && cost > doubleTapCostCap) return false;
  if(targetCard.type === 'counterShift' && !canUseCounterShift()) return false;
  return true;
}

function selectCard(cardId){
  if(!canAct()) return;
  if(redrawPending) return;
  if(gameOver || cardUsesLeft<=0 || pendingCard) return;
  if(turnNumber <= SKILL_LOCK_TURNS) return;
  const card = hands[current].find(c=>c.id===cardId);
  if(!card) return;
  const t = CARD_TYPES[card.type];
  if(bits[current] < t.cost) return;
  if(doubleTapCostCap !== null && card.type !== 'doubleTap' && t.cost > doubleTapCostCap) return;
  if(card.type === 'recycle'){
    if(doubleTapCostCap !== null) return;
    const eligible = discard.some(d=>isRecycleEligible(d));
    if(!eligible) return;
  }
  if(card.type === 'counterShift' && !canUseCounterShift()) return;
  pendingCard = {card, step:0, first:null};
  if(LINE_DOMINATION_TYPES.includes(card.type)){
    pendingCard.mode = 'row';
    pendingCard.lines = [];
    pendingCard.ready = false;
  }
  if(MULTI_CELL_PICK_TYPES[card.type]){
    pendingCard.picks = [];
    pendingCard.ready = false;
  }
  render();
}

function handleRecycleTarget(index){
  if(!canAct()) return;
  if(!pendingCard || pendingCard.card.type !== 'recycle' || pendingCard.isRecycled) return;
  const target = discard[index];
  if(!isRecycleEligible(target)) return;
  const cost = recycleCost(target.type);
  pendingCard = {
    card: {id:'recycled-'+target.type+'-'+Date.now(), type: target.type},
    step: 0,
    first: null,
    isRecycled: true,
    dynamicCost: cost,
    recycleSourceCard: pendingCard.card,
    mode: LINE_DOMINATION_TYPES.includes(target.type) ? 'row' : undefined,
    lines: LINE_DOMINATION_TYPES.includes(target.type) ? [] : undefined,
    ready: (LINE_DOMINATION_TYPES.includes(target.type) || MULTI_CELL_PICK_TYPES[target.type]) ? false : undefined,
    picks: MULTI_CELL_PICK_TYPES[target.type] ? [] : undefined
  };
  render();
}

function applyLineDomination(){
  if(!pendingCard || !pendingCard.ready) return;
  const cells = pendingCard.lines.flat();
  cells.forEach(({r,c})=>{
    const k = cellKey(r,c);
    if(board[r][c]!==0 && !protectedCells[k]){
      board[r][c] = current;
    }
  });
  consumeCard();
}

function applyDoubleBind(){
  if(!pendingCard || !pendingCard.ready) return;
  pendingCard.picks.forEach(({r,c})=>{
    boundCells[cellKey(r,c)] = {caster:current};
  });
  consumeCard();
}

function confirmPendingCard(){
  if(!canAct()) return;
  if(!pendingCard) return;
  const type = pendingCard.card.type;
  if(type==='counterShift'){
    applyCounterShift();
    return;
  }
  if(NO_TARGET_CARDS.includes(type)){ consumeCard(); return; }
  if((type==='triReverse' || type==='triBlock') && pendingCard.step===2){
    applyTrioEffect();
    return;
  }
  if(LINE_DOMINATION_TYPES.includes(type) && pendingCard.ready){
    applyLineDomination();
    return;
  }
  if(MULTI_CELL_PICK_TYPES[type] && pendingCard.ready){
    applyDoubleBind();
  }
}

function canUseCounterShift(){
  return !!(lastBoardManipEffect && lastBoardManipEffect.caster !== current && turnNumber === lastBoardManipEffect.castOnTurn + 1);
}

function applyCounterShift(){
  if(!pendingCard || pendingCard.card.type!=='counterShift' || !lastBoardManipEffect) return;
  // Only revert a cell if nothing has touched it since the skill fired
  // (its value still matches what the skill produced). Cells that were
  // legitimately changed afterward - e.g. a normal capture during the
  // caster's own placement that same turn - are left untouched, so this
  // undoes only the skill's own contribution, never later game events.
  lastBoardManipEffect.cells.forEach(({r,c,before,after})=>{
    if(!protectedCells[cellKey(r,c)] && board[r][c]===after) board[r][c] = before;
  });
  lastBoardManipEffect = null;
  consumeCard();
}

function handleMindReadTarget(opponentIndex){
  if(!canAct()) return;
  if(!pendingCard || pendingCard.card.type !== 'mindRead' || pendingCard.awaitingSwap) return;
  if(onlineMode){ requestOnlineMindRead(opponentIndex); return; }
  const opp = 3-current;
  const card = hands[opp][opponentIndex];
  if(!card) return;
  lastMindRead = {player:opp, index:opponentIndex, type:card.type};
  // 開示は必ず発生するので、ここでコストと手札消費を確定させる（リサイクル経由にも対応）
  const cost = pendingCard.isRecycled ? pendingCard.dynamicCost : CARD_TYPES.mindRead.cost;
  bits[current] = Math.max(0, bits[current] - cost);
  const sourceCard = pendingCard.isRecycled ? pendingCard.recycleSourceCard : pendingCard.card;
  const hand = hands[current];
  const idx = hand.findIndex(c=>c.id===sourceCard.id);
  if(idx>-1){
    hand[idx].owner = current;
    discard.push(hand[idx]);
    hand.splice(idx,1);
  }
  cardUsesLeft -= 1;
  pendingCard.awaitingSwap = true;
  pendingCard.revealedOpponentIndex = opponentIndex;
  checkGameEnd();
  render();
}

function handleMindReadSwap(ownIndex){
  if(!canAct()) return;
  if(!pendingCard || pendingCard.card.type !== 'mindRead' || pendingCard.awaitingSwap !== true) return;
  if(onlineMode){ handleMindReadSwapOnline(ownIndex); return; }
  const opp = 3-current;
  const ownCard = hands[current][ownIndex];
  const oppCard = hands[opp][pendingCard.revealedOpponentIndex];
  if(!ownCard || !oppCard) return;
  hands[current][ownIndex] = oppCard;
  hands[opp][pendingCard.revealedOpponentIndex] = ownCard;
  finishMindRead(true);
}

function skipMindReadSwap(){
  if(!canAct()) return;
  if(!pendingCard || pendingCard.card.type !== 'mindRead' || pendingCard.awaitingSwap !== true) return;
  if(onlineMode){ skipMindReadSwapOnline(); return; }
  finishMindRead(false);
}

function finishMindRead(swapped){
  if(lastMindRead) lastMindRead.swapped = !!swapped;
  pendingCard = null;
  checkGameEnd();
  render();
  if(onlineMode) pushOnlineState();
}

// ---------- online mind-read handshake ----------
// Hands live in per-player Firebase paths that only that player can read, so a
// caster can never directly read the opponent's hand array online. Instead we
// negotiate over the shared (public) mindReadOp field: request -> revealed ->
// swap-offered -> swap-done. Each side only ever reads/writes ITS OWN hand.
function makeMindReadOpId(){ return 'mr'+Date.now()+Math.random().toString(36).slice(2,7); }

async function requestOnlineMindRead(opponentIndex){
  if(!pendingCard || pendingCard.card.type!=='mindRead' || pendingCard.awaitingSwap) return;
  const cost = pendingCard.isRecycled ? pendingCard.dynamicCost : CARD_TYPES.mindRead.cost;
  bits[current] = Math.max(0, bits[current]-cost);
  const sourceCard = pendingCard.isRecycled ? pendingCard.recycleSourceCard : pendingCard.card;
  const hand = hands[current];
  const idx = hand.findIndex(c=>c.id===sourceCard.id);
  if(idx>-1){ hand[idx].owner=current; discard.push(hand[idx]); hand.splice(idx,1); }
  cardUsesLeft -= 1;
  const id = makeMindReadOpId();
  mindReadOp = {id, by: current, index: opponentIndex, phase: 'requested'};
  pendingCard.awaitingSwap = 'waiting';
  pendingCard.mindReadOpId = id;
  pendingCard.revealedOpponentIndex = opponentIndex;
  checkGameEnd();
  render();
  await pushOnlineState();
}

async function handleMindReadSwapOnline(ownIndex){
  if(!pendingCard || pendingCard.card.type!=='mindRead' || pendingCard.awaitingSwap!==true || !mindReadOp) return;
  const ownCard = hands[myPlayerNumber][ownIndex];
  if(!ownCard) return;
  pendingCard.swapOwnIndex = ownIndex;
  pendingCard.awaitingSwap = 'waiting-swap';
  mindReadOp = {...mindReadOp, phase:'swap-offered', offeredType: ownCard.type};
  render();
  await pushOnlineState();
}

async function skipMindReadSwapOnline(){
  if(!pendingCard || pendingCard.card.type!=='mindRead' || pendingCard.awaitingSwap!==true) return;
  if(lastMindRead) lastMindRead.swapped = false;
  pendingCard = null;
  mindReadOp = null;
  checkGameEnd();
  render();
  await pushOnlineState();
}

// Called after every applied remote state update while online. Reacts to the
// current phase of mindReadOp if (and only if) this client needs to act on it.
async function processIncomingMindReadOp(){
  if(!onlineMode || !mindReadOp || !myPlayerNumber) return;
  const op = mindReadOp;
  const iAmTarget = op.by !== myPlayerNumber;

  if(op.phase==='requested' && iAmTarget && !mindReadProcessedIds.has(op.id+':reveal')){
    mindReadProcessedIds.add(op.id+':reveal');
    const myCard = hands[myPlayerNumber][op.index];
    mindReadOp = {...op, phase:'revealed', revealedType: myCard ? myCard.type : null};
    await pushOnlineState();
    return;
  }

  if(op.phase==='revealed' && op.by===myPlayerNumber && pendingCard && pendingCard.mindReadOpId===op.id && pendingCard.awaitingSwap==='waiting'){
    lastMindRead = {player: opponentOf(myPlayerNumber), index: op.index, type: op.revealedType};
    pendingCard.awaitingSwap = true;
    render();
    return;
  }

  if(op.phase==='swap-offered' && iAmTarget && !mindReadProcessedIds.has(op.id+':swap')){
    mindReadProcessedIds.add(op.id+':swap');
    const myCard = hands[myPlayerNumber][op.index];
    const returnedType = myCard ? myCard.type : null;
    if(myCard){
      hands[myPlayerNumber][op.index] = {id:'swap-'+Date.now()+Math.random().toString(36).slice(2,6), type: op.offeredType};
    }
    mindReadOp = {...op, phase:'swap-done', returnedType};
    await pushOnlineState();
    return;
  }

  if(op.phase==='swap-done' && op.by===myPlayerNumber && pendingCard && pendingCard.mindReadOpId===op.id && !mindReadProcessedIds.has(op.id+':finish')){
    mindReadProcessedIds.add(op.id+':finish');
    const myIdx = pendingCard.swapOwnIndex;
    if(myIdx!==undefined && hands[myPlayerNumber][myIdx]){
      hands[myPlayerNumber][myIdx] = {id:'swap-'+Date.now()+Math.random().toString(36).slice(2,6), type: op.returnedType};
    }
    if(lastMindRead) lastMindRead.swapped = true;
    pendingCard = null;
    mindReadOp = null;
    checkGameEnd();
    render();
    await pushOnlineState();
    return;
  }
}

function canRedraw(){
  return canAct() && !pendingCard && !redrawPending && !gameOver
    && turnNumber > SKILL_LOCK_TURNS && !redrawUsedThisTurn
    && bits[current] >= REDRAW_COST && hands[current].length > 0
    && !(onlineMode && onlineWaitingForOpponent);
}

function startRedraw(){
  if(!canRedraw()) return;
  redrawPending = true;
  handRevealed[current] = true;
  render();
}

function cancelRedraw(){
  if(!canAct()) return;
  redrawPending = false;
  render();
}

function handleRedrawDiscard(idx){
  if(!canAct() || !redrawPending) return;
  const hand = hands[current];
  const card = hand[idx];
  if(!card) return;
  bits[current] = Math.max(0, bits[current] - REDRAW_COST);
  card.owner = current;
  discard.push(card);
  hand.splice(idx,1);
  drawCard(current);
  redrawUsedThisTurn = true;
  redrawPending = false;
  logAction({kind:'redraw'});
  render();
  if(onlineMode) pushOnlineState();
}

function cancelCard(){
  if(!canAct()) return;
  if(pendingCard && pendingCard.card.type==='mindRead' && pendingCard.awaitingSwap===true) return;
  const wasMindReadWaiting = pendingCard && pendingCard.card.type==='mindRead' && !!pendingCard.awaitingSwap;
  pendingCard = null;
  if(wasMindReadWaiting) mindReadOp = null;
  render();
  if(wasMindReadWaiting && onlineMode) pushOnlineState();
}

function handleCardTarget(r,c){
  const type = pendingCard.card.type;
  const key = cellKey(r,c);
  if(type==='reverse'){
    if(board[r][c]===0 || protectedCells[key]) return;
    const before = board[r][c];
    board[r][c] = board[r][c]===1?2:1;
    lastBoardManipEffect = {caster:current, sourceType:'reverse', castOnTurn:turnNumber, cells:[{r,c,before,after:board[r][c]}]};
    consumeCard();
  } else if(type==='block'){
    if(board[r][c]===0 || protectedCells[key]) return;
    protectedCells[key] = {caster:current};
    consumeCard();
  } else if(type==='slide'){
    if(pendingCard.step===0){
      if(board[r][c]===0 || protectedCells[key]) return;
      pendingCard.first = {r,c};
      pendingCard.step = 1;
      render();
    } else {
      const {r:fr,c:fc} = pendingCard.first;
      const dr=Math.abs(r-fr), dc=Math.abs(c-fc);
      const adjacent = dr<=1 && dc<=1 && !(dr===0&&dc===0);
      if(!adjacent || board[r][c]!==0 || boundCells[key]) return;
      const movingBefore = board[fr][fc];
      board[r][c] = board[fr][fc];
      board[fr][fc] = 0;
      const oldKey = cellKey(fr,fc);
      if(protectedCells[oldKey]){ protectedCells[key]=protectedCells[oldKey]; delete protectedCells[oldKey]; }
      lastBoardManipEffect = {caster:current, sourceType:'slide', castOnTurn:turnNumber, cells:[{r:fr,c:fc,before:movingBefore,after:0},{r,c,before:0,after:movingBefore}]};
      consumeCard();
    }
  } else if(type==='bind'){
    if(board[r][c]!==0 || boundCells[key]) return;
    boundCells[key] = {caster:current};
    consumeCard();
  } else if(type==='swap'){
    if(pendingCard.step===0){
      if(board[r][c]===0 || protectedCells[key]) return;
      pendingCard.first = {r,c};
      pendingCard.firstColor = board[r][c];
      pendingCard.step = 1;
      render();
    } else {
      const {r:fr,c:fc} = pendingCard.first;
      const dr = Math.abs(r-fr), dc = Math.abs(c-fc);
      const adjacent = dr<=1 && dc<=1 && !(dr===0&&dc===0);
      if(!adjacent) return;
      if(board[r][c]===0 || protectedCells[key]) return;
      if(board[r][c]===pendingCard.firstColor) return;
      const tmp = board[fr][fc];
      const destBefore = board[r][c];
      board[fr][fc] = board[r][c];
      board[r][c] = tmp;
      lastBoardManipEffect = {caster:current, sourceType:'swap', castOnTurn:turnNumber, cells:[{r:fr,c:fc,before:tmp,after:destBefore},{r,c,before:destBefore,after:tmp}]};
      consumeCard();
    }
  } else if(type==='triReverse'){
    if(pendingCard.step===2) return;
    if(pendingCard.step===0){
      pendingCard.first = {r,c};
      pendingCard.step = 1;
      render();
    } else {
      const {r:fr,c:fc} = pendingCard.first;
      const dr = r-fr, dc = c-fc;
      const adjacent = Math.abs(dr)<=1 && Math.abs(dc)<=1 && !(dr===0&&dc===0);
      if(!adjacent) return;
      pendingCard.second = {r,c};
      pendingCard.step = 2;
      render();
    }
  } else if(type==='triBlock'){
    if(pendingCard.step===2) return;
    if(pendingCard.step===0){
      if(board[r][c]!==current) return;
      pendingCard.first = {r,c};
      pendingCard.step = 1;
      render();
    } else {
      const {r:fr,c:fc} = pendingCard.first;
      const dr = r-fr, dc = c-fc;
      const adjacent = Math.abs(dr)<=1 && Math.abs(dc)<=1 && !(dr===0&&dc===0);
      if(!adjacent || board[r][c]!==current) return;
      const tr = r+dr, tc = c+dc;
      if(tr<0||tr>=SIZE||tc<0||tc>=SIZE || board[tr][tc]!==current) return;
      pendingCard.second = {r,c};
      pendingCard.third = {r:tr,c:tc};
      pendingCard.step = 2;
      render();
    }
  } else if(LINE_DOMINATION_TYPES.includes(type)){
    if(pendingCard.ready) return;
    const mode = pendingCard.mode || 'row';
    const line = mode==='row'
      ? Array.from({length:SIZE},(_,cc)=>({r, c:cc}))
      : Array.from({length:SIZE},(_,rr)=>({r:rr, c}));
    pendingCard.lines.push(line);
    const needed = type==='dualLineDomination' ? 2 : 1;
    if(pendingCard.lines.length >= needed){
      pendingCard.ready = true;
    }
    pendingCard.mode = 'row';
    render();
  } else if(MULTI_CELL_PICK_TYPES[type]){
    if(pendingCard.ready) return;
    if(board[r][c]!==0 || boundCells[key]) return;
    if(pendingCard.picks.some(p=>p.r===r && p.c===c)) return;
    pendingCard.picks.push({r,c});
    if(pendingCard.picks.length >= MULTI_CELL_PICK_TYPES[type]){
      pendingCard.ready = true;
    }
    render();
  }
}

function applyTrioEffect(){
  if(!pendingCard || !pendingCard.second) return;
  const type = pendingCard.card.type;
  const cells = type==='triReverse'
    ? [pendingCard.first, pendingCard.second]
    : [pendingCard.first, pendingCard.second, pendingCard.third];
  if(type==='triReverse'){
    const flippedCells = [];
    cells.forEach(({r,c})=>{
      const k = cellKey(r,c);
      if(board[r][c]!==0 && !protectedCells[k]){
        const before = board[r][c];
        board[r][c] = board[r][c]===1?2:1;
        flippedCells.push({r,c,before,after:board[r][c]});
      }
    });
    if(flippedCells.length>0) lastBoardManipEffect = {caster:current, sourceType:'triReverse', castOnTurn:turnNumber, cells:flippedCells};
  } else if(type==='triBlock'){
    cells.forEach(({r,c})=>{
      protectedCells[cellKey(r,c)] = {caster:current};
    });
  }
  consumeCard();
}

function onCellClick(r,c){
  if(!canAct()) return;
  if(redrawPending) return;
  if(gameOver) return;
  if(pendingCard){ handleCardTarget(r,c); return; }
  if(freeDropActive){
    const key = cellKey(r,c);
    if(board[r][c]!==0 || boundCells[key]) return;
    const flips = computeFlipsAt(r,c,current);
    placeStone(r,c,{r,c,flips});
    return;
  }
  if(twoDropFreeFirst && placementsLeft===2){
    const key = cellKey(r,c);
    if(board[r][c]!==0 || boundCells[key]) return;
    const flips = computeFlipsAt(r,c,current);
    twoDropFreeFirst = false; // only the FIRST of the two placements is free
    placeStone(r,c,{r,c,flips});
    return;
  }
  const moves = computeValidMoves(current);
  const mv = moves.find(m=>m.r===r && m.c===c);
  if(mv) placeStone(r,c,mv);
}

function doPass(){
  if(!canAct()) return;
  if(redrawPending) return;
  if(gameOver || pendingCard) return;
  if(getAvailableMoves().length>0) return;
  logAction({kind:'pass'});
  passStreak += 1;
  if(passStreak >= PASS_STREAK_LIMIT){
    gameOver = true;
    render();
    if(onlineMode) pushOnlineState();
    return;
  }
  endTurn();
}

function getCardTargets(){
  const set = new Set();
  if(!pendingCard) return set;
  const type = pendingCard.card.type;
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const key = cellKey(r,c);
      if(type==='reverse' || type==='block'){
        if(board[r][c]!==0 && !protectedCells[key]) set.add(key);
      } else if(type==='slide'){
        if(pendingCard.step===0){
          if(board[r][c]!==0 && !protectedCells[key]) set.add(key);
        } else {
          const {r:fr,c:fc} = pendingCard.first;
          const dr=Math.abs(r-fr), dc=Math.abs(c-fc);
          if(dr<=1 && dc<=1 && !(dr===0&&dc===0) && board[r][c]===0 && !boundCells[key]) set.add(key);
        }
      } else if(type==='bind'){
        if(board[r][c]===0 && !boundCells[key]) set.add(key);
      } else if(type==='swap'){
        if(pendingCard.step===0){
          if(board[r][c]!==0 && !protectedCells[key]) set.add(key);
        } else {
          const {r:fr,c:fc} = pendingCard.first;
          const dr = Math.abs(r-fr), dc = Math.abs(c-fc);
          const adjacent = dr<=1 && dc<=1 && !(dr===0&&dc===0);
          if(adjacent && board[r][c]!==0 && board[r][c]!==pendingCard.firstColor && !protectedCells[key]) set.add(key);
        }
      } else if(type==='triReverse'){
        if(pendingCard.step===0){
          set.add(key);
        } else if(pendingCard.step===1){
          const {r:fr,c:fc} = pendingCard.first;
          const dr = r-fr, dc = c-fc;
          const adjacent = Math.abs(dr)<=1 && Math.abs(dc)<=1 && !(dr===0&&dc===0);
          if(adjacent) set.add(key);
        }
      } else if(type==='triBlock'){
        if(pendingCard.step===0){
          if(board[r][c]===current) set.add(key);
        } else if(pendingCard.step===1){
          const {r:fr,c:fc} = pendingCard.first;
          const dr = r-fr, dc = c-fc;
          const adjacent = Math.abs(dr)<=1 && Math.abs(dc)<=1 && !(dr===0&&dc===0);
          if(adjacent && board[r][c]===current){
            const tr = r+dr, tc = c+dc;
            if(tr>=0&&tr<SIZE&&tc>=0&&tc<SIZE&&board[tr][tc]===current) set.add(key);
          }
        }
      } else if(LINE_DOMINATION_TYPES.includes(type)){
        if(!pendingCard.ready) set.add(key);
      } else if(MULTI_CELL_PICK_TYPES[type]){
        if(!pendingCard.ready && board[r][c]===0 && !boundCells[key] && !pendingCard.picks.some(p=>p.r===r && p.c===c)) set.add(key);
      }
    }
  }
  return set;
}

function getAvailableMoves(){
  if(freeDropActive || (twoDropFreeFirst && placementsLeft===2)){
    const arr = [];
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(board[r][c]===0 && !boundCells[cellKey(r,c)]) arr.push({r,c});
      }
    }
    return arr;
  }
  return computeValidMoves(current);
}

      if(pendingCard && LINE_DOMINATION_TYPES.includes(pendingCard.card.type) && pendingCard.lines && pendingCard.lines.length>0){

      if(pendingCard && MULTI_CELL_PICK_TYPES[pendingCard.card.type] && pendingCard.picks && pendingCard.picks.length>0){

      if(!pendingCard && moveSet.has(key) && !gameOver && canAct()) div.classList.add('clickable');

        div.appendChild(b);

  // hands

  [1,2].forEach(p=>{

    const revealed = (handRevealed[p] && !isMindReadTarget) || isSwapChoiceOwner || isRedrawChoiceOwner;
    if(revealed){
      hands[p].forEach((card,idx)=>{
        const t = CARD_TYPES[card.type];
        const el = document.createElement('div');
        if(isSwapChoiceOwner){

          el.title = t.name[LANG];
          if(canAct()) el.addEventListener('click', ()=>handleRedrawDiscard(idx));

        }
        const turnOk = canAct() && p===current && !gameOver && cardUsesLeft>0 && !pendingCard && !redrawPending && turnNumber>SKILL_LOCK_TURNS;

// ---------- Online sync (Firebase Realtime Database) ----------
function storageAvailable(){ return !!window.psyFirebase; }
async function waitForFirebase(){
  if(window.psyFirebase) return await window.psyFirebase.ready();
  await new Promise(resolve=>window.addEventListener('psyFirebaseReady', resolve, {once:true}));
  return await window.psyFirebase.ready();
}
function generateRoomCode(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
function colorKeyOf(p){ return p===1 ? 'black' : 'white'; }
function opponentOf(p){ return 3-p; }

function serializeState(seq){
  handCounts[1] = hands[1] ? hands[1].length : handCounts[1];
  handCounts[2] = hands[2] ? hands[2].length : handCounts[2];
  if(myPlayerNumber) handCounts[myPlayerNumber] = hands[myPlayerNumber].length;
  // NOTE: lastMindRead is intentionally NOT included here. Online, it's
  // requester-only information learned via the mindReadOp handshake, not
  // public game state - syncing it would let a later unrelated push from
  // either side clobber the requester's own freshly-learned reveal.
  return {seq,board,current,deck,discard,protectedCells,boundCells,bits,placementsLeft,cardUsesLeft,doubleTapCostCap,freeDropActive,twoDropFreeFirst,passStreak,turnNumber,gameOver,idSeed,redrawUsedThisTurn,joined:onlineJoined,handCounts,mindReadOp,lastTurnLog,deckReshuffleNotice,lastBoardManipEffect};
}
function applyRemoteState(data){
  hands = hands || {1:[], 2:[]};
  handRevealed = handRevealed || {1:false, 2:false};
  // Preserve an in-flight mindRead handshake on THIS client (the requester)
  // across incoming updates - otherwise the opponent's legitimate reveal/
  // swap-done response would wipe the very pendingCard tracking it.
  const keepPendingCard = pendingCard;
  const keepLastMindRead = lastMindRead;
  const preserveMindReadState = !!(pendingCard && pendingCard.card && pendingCard.card.type==='mindRead'
    && pendingCard.mindReadOpId && data.mindReadOp && data.mindReadOp.id===pendingCard.mindReadOpId);
  board=data.board; current=data.current; deck=data.deck||[]; discard=data.discard||[]; protectedCells=data.protectedCells||{}; boundCells=data.boundCells||{}; bits=data.bits; placementsLeft=data.placementsLeft; cardUsesLeft=data.cardUsesLeft; doubleTapCostCap=(data.doubleTapCostCap===undefined?null:data.doubleTapCostCap); freeDropActive=!!data.freeDropActive; twoDropFreeFirst=!!data.twoDropFreeFirst; passStreak=data.passStreak; turnNumber=data.turnNumber; gameOver=!!data.gameOver; idSeed=data.idSeed; redrawUsedThisTurn=!!data.redrawUsedThisTurn; onlineJoined=data.joined||onlineJoined; onlineWaitingForOpponent=!(onlineJoined[1]&&onlineJoined[2]); onlineLastAppliedSeq=data.seq||0; redrawPending=false;
  pendingCard = preserveMindReadState ? keepPendingCard : null;
  lastMindRead = preserveMindReadState ? keepLastMindRead : null;
  handCounts = data.handCounts || handCounts;
  mindReadOp = data.mindReadOp || null;
  lastTurnLog = data.lastTurnLog || null;
  deckReshuffleNotice = !!data.deckReshuffleNotice;
  lastBoardManipEffect = data.lastBoardManipEffect || null;
  if(myPlayerNumber){
    const opp = opponentOf(myPlayerNumber);
    const n = (handCounts && handCounts[opp]) || 0;
    hands[opp] = Array.from({length:n}, (_,i)=>({id:'hidden-'+opp+'-'+i, type:'__hidden__'}));
    handCounts[myPlayerNumber] = hands[myPlayerNumber] ? hands[myPlayerNumber].length : handCounts[myPlayerNumber];
  }
}
async function pushMyHand(){
  if(!onlineMode || !onlineRoomCode || !myPlayerNumber || !window.psyFirebase) return;
  handCounts[myPlayerNumber] = hands[myPlayerNumber].length;
  try{ await window.psyFirebase.pushHand(onlineRoomCode, colorKeyOf(myPlayerNumber), hands[myPlayerNumber]); }
  catch(e){ console.error('hand push error', e); }
}
async function pushOnlineState(){
  if(!onlineRoomCode||!window.psyFirebase) return;
  const seq=onlineLastAppliedSeq+1;
  const prevSeq=onlineLastAppliedSeq;
  // Bump the local seq BEFORE awaiting the write. Firebase's onValue listener
  // fires for our OWN writes too (an "echo"), often before this await resolves.
  // If we bumped seq only after the await, that echo would look "newer" than
  // what we've applied and applyRemoteState() would stomp on in-progress local
  // state (e.g. a pendingCard mid-handshake) with a copy of what we just sent.
  onlineLastAppliedSeq=seq;
  try{
    const state=serializeState(seq);
    const ok=await window.psyFirebase.pushState(onlineRoomCode,state,myPlayerNumber);
    if(!ok){ onlineLastAppliedSeq=prevSeq; console.error('pushState rejected'); }
  }catch(e){ onlineLastAppliedSeq=prevSeq; console.error('online push error',e); }
  await pushMyHand();
}
function startPolling(){
  stopPolling();
  if(!window.psyFirebase||!onlineRoomCode) return;
  window.psyFirebase.listen(onlineRoomCode, room=>{
    if(!room||!room.state) return; const data=room.state;
    if((data.seq||0)>onlineLastAppliedSeq){
      const wasWaiting=onlineWaitingForOpponent;
      applyRemoteState(data);
      if(wasWaiting&&!onlineWaitingForOpponent) hideWaitingOverlay();
      updateOnlineInfoBar();
      render();
      processIncomingMindReadOp();
    }
  });
}
function stopPolling(){ if(window.psyFirebase) window.psyFirebase.unlisten(); if(onlinePollTimer){clearInterval(onlinePollTimer);onlinePollTimer=null;} }
async function createRoom(){
  if(onlineCreatePending) return;
  onlineCreatePending=true;
  const btn=document.getElementById('createRoomBtn');
  const msgEl=document.getElementById('lobbyMsg');
  btn.disabled=true; msgEl.className='lobby-msg'; msgEl.textContent=tr('lobbyCreating');
  try{
    const user=await waitForFirebase(); if(!user) throw new Error('auth');
    let code,existing;
    do{ code=generateRoomCode(); existing=await window.psyFirebase.getRoom(code); }while(existing);

    onlineRoomCode=code; myPlayerNumber=1; onlineMode=true;
    onlineJoined={1:true,2:false}; onlineWaitingForOpponent=true; onlineLastAppliedSeq=0;
    mindReadOp=null; mindReadProcessedIds=new Set();
    initGame();
    handCounts = {1:hands[1].length, 2:hands[2].length};
    const blackHand = hands[1];
    const whiteHand = hands[2];
    const state=serializeState(1);
    await window.psyFirebase.createRoom(code,state,blackHand,whiteHand);
    onlineLastAppliedSeq=1;
    // ホスト自身のランタイムからもゲスト(白)の手札の実データを破棄し、以後は枚数だけを保持する
    hands[2] = Array.from({length:whiteHand.length}, (_,i)=>({id:'hidden-2-'+i, type:'__hidden__'}));
    showGameScreen(); updateOnlineInfoBar(); showWaitingOverlay(code); startPolling();
  }catch(e){
    console.error('createRoom failed',e);
    msgEl.className='lobby-msg error'; msgEl.textContent=tr('lobbyErrorStorage');
    onlineMode=false; onlineRoomCode=null; myPlayerNumber=null;
  }finally{
    onlineCreatePending=false; btn.disabled=false;
  }
}
async function joinRoom(){
  if(onlineJoinPending) return;
  const input=document.getElementById('joinCodeInput');
  const code=input.value.trim().toUpperCase();
  const msgEl=document.getElementById('lobbyMsg');
  const btn=document.getElementById('joinRoomBtn');
  if(!code){ msgEl.className='lobby-msg error'; msgEl.textContent=tr('lobbyErrorNoCode'); return; }

  onlineJoinPending=true; btn.disabled=true;
  msgEl.className='lobby-msg'; msgEl.textContent=tr('lobbyJoining');

  try{
    const user=await waitForFirebase(); if(!user) throw new Error('auth');

    // Read only to distinguish "not found".  Do NOT decide "full" here:
    // admission is decided atomically by claimGuest(), avoiding stale reads.
    const existing=await window.psyFirebase.getRoom(code);
    if(!existing||!existing.state){
      msgEl.className='lobby-msg error'; msgEl.textContent=tr('lobbyErrorNotFound'); return;
    }

    const result=await window.psyFirebase.claimGuest(code);
    if(!result?.ok){
      msgEl.className='lobby-msg error';
      msgEl.textContent=result?.reason==='not-found'?tr('lobbyErrorNotFound'):tr('lobbyErrorFull');
      return;
    }

    const room=result.room;
    onlineRoomCode=code; myPlayerNumber=2; onlineMode=true;
    mindReadOp=null; mindReadProcessedIds=new Set();
    applyRemoteState(room.state);
    hands[2] = (room.hands && room.hands.white) ? room.hands.white : [];
    handCounts[2] = hands[2].length;
    handRevealed = {1:false, 2:true};
    onlineWaitingForOpponent=false;
    showGameScreen(); updateOnlineInfoBar(); render(); startPolling();
  }catch(e){
    console.error('joinRoom failed',e);
    msgEl.className='lobby-msg error'; msgEl.textContent=tr('lobbyErrorStorage');
  }finally{
    onlineJoinPending=false; btn.disabled=false;
  }
}
async function leaveRoom(){
  const code=onlineRoomCode;
  const role=myPlayerNumber;

  // Tear down the local UI immediately.
  stopPolling();
  onlineMode=false; onlineRoomCode=null; myPlayerNumber=null;
  onlineJoined={1:false,2:false}; onlineWaitingForOpponent=false;
  mindReadOp=null; mindReadProcessedIds=new Set(); handCounts={1:0,2:0};
  turnActionLog=[]; lastTurnLog=null;
  deckReshuffleNotice=false; lastBoardManipEffect=null;
  hideWaitingOverlay();
  document.getElementById('onlineInfoBar').style.display='none';
  document.getElementById('overlay').classList.remove('show');
  showTitleScreen();

  // Then clean up Firebase best-effort.
  if(!code||!window.psyFirebase) return;
  try{
    if(role===1) await window.psyFirebase.removeRoom(code);
    else if(role===2) await window.psyFirebase.releaseGuest(code);
  }catch(e){
    console.warn('leaveRoom cleanup failed',e);
  }
}

      if(label) label.textContent = handRevealed[p] ? tr('revealHide') : tr('revealShow');
    });
  }
  renderRules();
  updateOnlineInfoBar();
  const jaBtns = ['langBtnJaTitle','langBtnJaLobby','langBtnJaGame'];
  const enBtns = ['langBtnEnTitle','langBtnEnLobby','langBtnEnGame'];
  jaBtns.concat(enBtns).forEach(id=>document.getElementById(id).classList.remove('active'));
  (LANG==='ja'?jaBtns:enBtns).forEach(id=>document.getElementById(id).classList.add('active'));
}

function setLang(l){
  LANG = l;
  applyI18nStatic();
  if(document.getElementById('screen-game').classList.contains('active') && typeof board !== 'undefined' && board) render();
}

// ---------- event wiring ----------
document.getElementById('cancelBtn').addEventListener('click', cancelCard);
document.getElementById('confirmBtn').addEventListener('click', confirmPendingCard);
document.getElementById('passBtn').addEventListener('click', doPass);
document.getElementById('restartBtn').addEventListener('click', ()=>{ if(!onlineMode) initGame(); });
document.getElementById('playAgainBtn').addEventListener('click', ()=>{ if(!onlineMode) initGame(); });
document.getElementById('revealBtn1').addEventListener('click', ()=>{ if(onlineMode && myPlayerNumber!==1) return; handRevealed[1] = !handRevealed[1]; render(); });
document.getElementById('revealBtn2').addEventListener('click', ()=>{ if(onlineMode && myPlayerNumber!==2) return; handRevealed[2] = !handRevealed[2]; render(); });
document.getElementById('mindReadCloseBtn').addEventListener('click', ()=>{ lastMindRead = null; render(); });
document.getElementById('deckReshuffleCloseBtn').addEventListener('click', ()=>{ deckReshuffleNotice = false; render(); if(onlineMode) pushOnlineState(); });
document.getElementById('modeRowBtn').addEventListener('click', ()=>{ if(pendingCard && !pendingCard.ready){ pendingCard.mode='row'; render(); } });
document.getElementById('modeColBtn').addEventListener('click', ()=>{ if(pendingCard && !pendingCard.ready){ pendingCard.mode='col'; render(); } });
document.getElementById('redrawBtn').addEventListener('click', startRedraw);
document.getElementById('redrawCancelBtn').addEventListener('click', cancelRedraw);
document.getElementById('mindReadSkipBtn').addEventListener('click', skipMindReadSwap);

document.getElementById('modeBtnLocal').addEventListener('click', ()=>{
  onlineMode=false; myPlayerNumber=null; onlineRoomCode=null;
  document.getElementById('onlineInfoBar').style.display='none';
  showGameScreen();
  initGame();
});
document.getElementById('modeBtnOnlineCustom').addEventListener('click', async ()=>{
  const msg=document.getElementById('lobbyMsg');
  showLobbyScreen();
  try{ await waitForFirebase(); }catch(e){ if(msg){msg.className='lobby-msg error';msg.textContent=tr('lobbyErrorStorage');} }
});
document.getElementById('lobbyBackBtn').addEventListener('click', showTitleScreen);
document.getElementById('createRoomBtn').addEventListener('click', createRoom);
document.getElementById('joinRoomBtn').addEventListener('click', joinRoom);
document.getElementById('waitingCancelBtn').addEventListener('click', leaveRoom);
document.getElementById('backToTitleBtn').addEventListener('click', ()=>{
  if(onlineMode){ leaveRoom(); } else { showTitleScreen(); }
});
document.getElementById('leaveRoomInGameBtn').addEventListener('click', leaveRoom);
document.getElementById('leaveRoomAfterGameBtn').addEventListener('click', leaveRoom);

['langBtnJaTitle','langBtnJaLobby','langBtnJaGame'].forEach(id=>document.getElementById(id).addEventListener('click', ()=>setLang('ja')));
['langBtnEnTitle','langBtnEnLobby','langBtnEnGame'].forEach(id=>document.getElementById(id).addEventListener('click', ()=>setLang('en')));

applyI18nStatic();
showTitleScreen();
</script>
